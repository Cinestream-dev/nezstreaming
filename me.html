<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile - Cine Mirror</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* --- CORE PREMIUM ENGINE --- */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; 
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            user-select: none; outline: none;
        }

        body {
            background-color: #000000; color: #ffffff;
            overflow-x: hidden; scroll-behavior: smooth; min-height: 100vh;
        }

        /* --- NAVBAR --- */
        .hdr {
            position: sticky; top: 0; left: 0; right: 0; height: 80px; z-index: 1000;
            display: flex; align-items: center; padding: 0 5%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .back-btn {
            width: 42px; height: 42px; border-radius: 50%;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center; color: #fff;
            cursor: pointer; transition: 0.2s ease; font-size: 16px;
        }
        .back-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.1); }
        .hdr-title { font-size: 20px; font-weight: 800; margin-left: 15px; letter-spacing: -0.5px;}

        /* --- CONTENT WRAPPER --- */
        .content-wrapper { padding: 25px 5% 50px; display: flex; flex-direction: column; gap: 30px; }
        .sec-title { font-size: 18px; font-weight: 800; margin-bottom: 15px; color: #fff; display: flex; align-items: center; gap: 8px; }

        /* --- BASIC INFO SECTION --- */
        .info-card {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 15px;
        }
        .info-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .info-row:last-child { border-bottom: none; padding-bottom: 0; }
        .info-lbl { color: #8e8e93; font-weight: 600; display: flex; align-items: center; gap: 8px;}
        .info-val { font-weight: 700; color: #fff; text-align: right;}
        
        /* INLINE EDIT USERNAME */
        .name-edit-box { display: flex; flex-direction: column; gap: 5px; width: 100%; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px;}
        .name-input-row { display: flex; align-items: center; justify-content: space-between; background: transparent; border-radius: 8px; transition: 0.2s;}
        .name-input-row.editing { background: rgba(255,255,255,0.05); padding: 5px 10px; border: 1px solid rgba(31, 128, 224, 0.5); }
        .name-input { background: transparent; border: none; color: #fff; font-size: 16px; font-weight: 800; outline: none; width: 100%; pointer-events: none;}
        .name-input-row.editing .name-input { pointer-events: auto; }
        .action-icon-btn { background: transparent; border: none; color: #8e8e93; font-size: 16px; cursor: pointer; padding: 5px; transition: 0.2s; }
        .action-icon-btn:active { transform: scale(0.85); }
        .action-icon-btn.editing-mode { color: #32d74b; }
        .error-msg { color: #ff453a; font-size: 12px; font-weight: 600; display: none; margin-left: 2px;}

        /* --- HISTORY GROUPS --- */
        .history-group { margin-bottom: 30px; }
        .group-header { font-size: 16px; color: #e1e6eb; font-weight: 800; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;}
        .group-header i { color: #1F80E0; }

        /* --- MOVIES (VERTICAL POSTERS) --- */
        .history-card { 
            display: flex; gap: 15px; background: rgba(255, 255, 255, 0.04); 
            border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; 
            padding: 12px; margin-bottom: 14px; cursor: pointer; transition: 0.2s;
        }
        .history-card:active { transform: scale(0.97); }
        .history-card:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(31, 128, 224, 0.5); }
        
        .history-poster-wrap { position: relative; width: 85px; height: 125px; flex-shrink: 0; border-radius: 8px; overflow: hidden; background: #111; }
        .history-poster { width: 100%; height: 100%; object-fit: cover; }
        .h-progress-bg { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: rgba(0,0,0,0.8); z-index: 3; }
        .h-progress-fill { height: 100%; background: linear-gradient(90deg, #1F80E0, #e00073); border-radius: 0 2px 2px 0; }
        
        .history-info { flex: 1; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        .h-title { font-size: 17px; font-weight: 800; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 6px;}
        .h-desc { font-size: 13px; color: #8e8e93; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4;}

        /* --- SERIES (HORIZONTAL EPISODE CARDS LIKE DETAIL.HTML) --- */
        .ep-card { display: flex; gap: 15px; background: rgba(20, 20, 25, 0.6); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s; align-items: center; margin-bottom: 12px;}
        .ep-card:active { transform: scale(0.97); }
        .ep-card:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(31, 128, 224, 0.5); }
        
        .ep-thumb { width: 130px; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; position: relative; flex-shrink: 0; background: #111; }
        .ep-thumb img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; transition: opacity 0.3s; }
        .ep-card:hover .ep-thumb img { opacity: 1; }
        
        .ep-progress-bg { position: absolute; bottom: 0; left: 0; right: 0; height: 4px; background: rgba(0,0,0,0.8); z-index: 3; }
        .ep-progress-fill { height: 100%; background: linear-gradient(90deg, #1F80E0, #e00073); border-radius: 0 2px 2px 0; }
        
        .ep-info { display: flex; flex-direction: column; justify-content: center; padding-right: 5px; width: 100%; overflow: hidden;}
        .ep-num { font-size: 11px; color: #1F80E0; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.5px; background: rgba(31, 128, 224, 0.15); padding: 2px 6px; border-radius: 4px; width: fit-content;}
        .ep-title { font-size: 15px; font-weight: 700; color: #fff; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ep-desc-text { font-size: 12px; color: rgba(255,255,255,0.6); line-height: 1.4; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* --- REVIEWS SECTION --- */
        .reviews-list { display: flex; flex-direction: column; gap: 12px; }
        .my-review-card { background: rgba(20, 20, 25, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .rev-movie-title { font-size: 14px; font-weight: 800; color: #1F80E0;}
        .rev-stars { color: #f5c518; font-size: 12px; letter-spacing: 2px;}
        .rev-text { font-size: 13px; color: #e1e6eb; line-height: 1.4; }

        /* --- ANIMATED GRADIENT LOGOUT BUTTON --- */
        .logout-wrapper { position: relative; display: flex; justify-content: center; width: 100%; max-width: 220px; margin: 20px auto; border-radius: 12px; overflow: hidden; padding: 2px; }
        .logout-glow-bg { position: absolute; inset: 0; background: linear-gradient(90deg, #1F80E0 0%, #e00073 100%); z-index: 0; transition: opacity 0.3s; }
        @keyframes rotateBorder { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        .logout-loader-ring { position: absolute; top: 50%; left: 50%; width: 300%; height: 300%; background: conic-gradient(transparent, transparent, transparent, #1F80E0, #e00073); animation: rotateBorder 1.2s linear infinite; z-index: 1; opacity: 0; transition: opacity 0.3s; transform-origin: center; }
        
        .logout-btn-inner { position: relative; background: linear-gradient(90deg, #1F80E0 0%, #e00073 100%); color: white; border: none; width: 100%; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; z-index: 2; transition: transform 0.2s, background 0.3s; }
        .logout-wrapper:active .logout-btn-inner { transform: scale(0.96); }
        
        .logout-wrapper.loading .logout-glow-bg { opacity: 0; }
        .logout-wrapper.loading .logout-loader-ring { opacity: 1; }
        .logout-wrapper.loading .logout-btn-inner { background: #111; color: #8e8e93; pointer-events: none; }

        /* --- NEW 16-BAR PINK+BLUE LOADER --- */
        .loader-container { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 5000; background: #000000; transition: opacity 0.3s; }
        .loader-circle-44 { position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;}
        .loader-circle-44 > div {
            position: absolute; width: 2.5px; height: 9px;
            background: linear-gradient(180deg, #1F80E0 0%, #e00073 100%);
            border-radius: 2px; opacity: 0.05; animation: fadeit 0.8s linear infinite;
        }
        
        .loader-circle-44 > .bar-1 { transform: rotate(0deg) translate(0, -14px); animation-delay: 0.05s; }
        .loader-circle-44 > .bar-2 { transform: rotate(22.5deg) translate(0, -14px); animation-delay: 0.1s; }
        .loader-circle-44 > .bar-3 { transform: rotate(45deg) translate(0, -14px); animation-delay: 0.15s; }
        .loader-circle-44 > .bar-4 { transform: rotate(67.5deg) translate(0, -14px); animation-delay: 0.2s; }
        .loader-circle-44 > .bar-5 { transform: rotate(90deg) translate(0, -14px); animation-delay: 0.25s; }
        .loader-circle-44 > .bar-6 { transform: rotate(112.5deg) translate(0, -14px); animation-delay: 0.3s; }
        .loader-circle-44 > .bar-7 { transform: rotate(135deg) translate(0, -14px); animation-delay: 0.35s; }
        .loader-circle-44 > .bar-8 { transform: rotate(157.5deg) translate(0, -14px); animation-delay: 0.4s; }
        .loader-circle-44 > .bar-9 { transform: rotate(180deg) translate(0, -14px); animation-delay: 0.45s; }
        .loader-circle-44 > .bar-10 { transform: rotate(202.5deg) translate(0, -14px); animation-delay: 0.5s; }
        .loader-circle-44 > .bar-11 { transform: rotate(225deg) translate(0, -14px); animation-delay: 0.55s; }
        .loader-circle-44 > .bar-12 { transform: rotate(247.5deg) translate(0, -14px); animation-delay: 0.6s; }
        .loader-circle-44 > .bar-13 { transform: rotate(270deg) translate(0, -14px); animation-delay: 0.65s; }
        .loader-circle-44 > .bar-14 { transform: rotate(292.5deg) translate(0, -14px); animation-delay: 0.7s; }
        .loader-circle-44 > .bar-15 { transform: rotate(315deg) translate(0, -14px); animation-delay: 0.75s; }
        .loader-circle-44 > .bar-16 { transform: rotate(337.5deg) translate(0, -14px); animation-delay: 0.8s; }
        
        @keyframes fadeit { 0% { opacity: 1; box-shadow: 0 0 5px rgba(224,0,115,0.8); } 100% { opacity: 0; box-shadow: none;} }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="loader-container" id="main-loader">
        <div class="loader-circle-44">
            <div class="bar-1"></div><div class="bar-2"></div><div class="bar-3"></div><div class="bar-4"></div>
            <div class="bar-5"></div><div class="bar-6"></div><div class="bar-7"></div><div class="bar-8"></div>
            <div class="bar-9"></div><div class="bar-10"></div><div class="bar-11"></div><div class="bar-12"></div>
            <div class="bar-13"></div><div class="bar-14"></div><div class="bar-15"></div><div class="bar-16"></div>
        </div>
    </div>

    <header class="hdr">
        <div class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></div>
        <div class="hdr-title">My Account</div>
    </header>

    <div class="content-wrapper">
        
        <div id="basic-info-sec">
            <div class="sec-title"><i class="fa-solid fa-id-card" style="color: #1F80E0;"></i> Basic Information</div>
            <div class="info-card">
                <div class="name-edit-box">
                    <span class="info-lbl" style="font-size: 12px; margin-bottom: 2px;">Username</span>
                    <div class="name-input-row" id="name-row">
                        <input type="text" id="username-input" class="name-input" value="Loading..." spellcheck="false" autocomplete="off" readonly>
                        <button class="action-icon-btn" id="edit-name-btn" onclick="toggleEditMode()"><i class="fa-solid fa-pen"></i></button>
                    </div>
                    <span class="error-msg" id="name-error">Username already exists.</span>
                </div>

                <div class="info-row">
                    <span class="info-lbl"><i id="provider-icon" class="fa-brands fa-google"></i> Login with</span>
                    <span class="info-val" id="provider-val">Google</span>
                </div>
                <div class="info-row">
                    <span class="info-lbl"><i class="fa-solid fa-envelope"></i> Email ID</span>
                    <span class="info-val" id="email-val" style="font-size: 13px;">...</span>
                </div>
                <div class="info-row">
                    <span class="info-lbl"><i class="fa-solid fa-calendar-days"></i> First Login</span>
                    <span class="info-val" id="created-val" style="font-size: 13px;">...</span>
                </div>
                <div class="info-row">
                    <span class="info-lbl"><i class="fa-solid fa-clock-rotate-left"></i> Last Login</span>
                    <span class="info-val" id="last-login-val" style="font-size: 13px;">...</span>
                </div>
            </div>
        </div>

        <div id="history-sec" style="display: none;">
            <div class="sec-title"><i class="fa-solid fa-clock-rotate-left" style="color: #e00073;"></i> Recently Watched</div>
            <div id="history-container"></div>
        </div>

        <div id="reviews-sec" style="display: none;">
            <div class="sec-title"><i class="fa-solid fa-star" style="color: #f5c518;"></i> My Reviews</div>
            <div class="reviews-list" id="reviews-container"></div>
        </div>

        <div class="logout-wrapper" id="logout-wrapper">
            <div class="logout-glow-bg"></div>
            <div class="logout-loader-ring"></div>
            <button class="logout-btn-inner" onclick="triggerLogout()">
                <i class="fa-solid fa-power-off" id="logout-icon"></i> 
                <span id="logout-text">Logout Account</span>
            </button>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
        import { getDatabase, ref, get, set, child, remove } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDe8ay0sotr15cakvFFan4EO47J8gARcc0",
            authDomain: "nexstream-abd76.firebaseapp.com",
            databaseURL: "https://nexstream-abd76-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "nexstream-abd76",
            storageBucket: "nexstream-abd76.firebasestorage.app",
            messagingSenderId: "441736257520",
            appId: "1:441736257520:web:c1db8f9dd0922c245b0735"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const dbRef = ref(getDatabase(app));
        const db = getDatabase(app);

        let currentUser = null;
        let currentUsername = "";
        let isEditing = false;
        let allMoviesData = [];

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.replace('login.html');
            } else {
                currentUser = user;
                
                document.getElementById('email-val').innerText = user.email;
                if(user.metadata) {
                    document.getElementById('created-val').innerText = new Date(user.metadata.creationTime).toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' });
                    document.getElementById('last-login-val').innerText = new Date(user.metadata.lastSignInTime).toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
                }

                if(user.providerData && user.providerData.length > 0) {
                    if(user.providerData[0].providerId === 'password') {
                        document.getElementById('provider-val').innerText = 'Email ID';
                        document.getElementById('provider-icon').className = 'fa-solid fa-envelope';
                    }
                }

                await loadProfileData();
                await fetchHistoryAndReviews();
                
                document.getElementById('main-loader').style.opacity = '0';
                setTimeout(() => document.getElementById('main-loader').style.display = 'none', 300);
            }
        });

        // --- INLINE USERNAME EDITING ---
        async function loadProfileData() {
            try {
                const snap = await get(child(dbRef, `users/${currentUser.uid}/profile/username`));
                currentUsername = snap.exists() ? snap.val() : (currentUser.displayName || currentUser.email.split('@')[0]);
                document.getElementById('username-input').value = currentUsername;
            } catch(e) { console.log(e); }
        }

        window.toggleEditMode = async function() {
            const input = document.getElementById('username-input');
            const row = document.getElementById('name-row');
            const btn = document.getElementById('edit-name-btn');
            const err = document.getElementById('name-error');

            if (!isEditing) {
                isEditing = true;
                input.readOnly = false;
                row.classList.add('editing');
                btn.classList.add('editing-mode');
                btn.innerHTML = '<i class="fa-solid fa-check"></i>';
                err.style.display = 'none';
                input.focus();
                const val = input.value; input.value = ''; input.value = val;
            } else {
                const newName = input.value.trim();
                if(newName.toLowerCase() === currentUsername.toLowerCase() || newName === "") { cancelEdit(); return; }
                if(!/^[a-zA-Z0-9 ]+$/.test(newName)) {
                    err.innerText = "Only letters & numbers allowed!"; err.style.display = 'block'; return;
                }

                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
                btn.style.pointerEvents = 'none'; err.style.display = 'none';

                try {
                    const lowerName = newName.toLowerCase();
                    const checkSnap = await get(child(dbRef, `usernames/${lowerName}`));
                    
                    if(checkSnap.exists() && checkSnap.val() !== currentUser.uid) {
                        err.innerText = "Username already exists."; err.style.display = 'block';
                        btn.innerHTML = '<i class="fa-solid fa-check"></i>'; btn.style.pointerEvents = 'auto'; return;
                    }

                    if(currentUsername) await remove(ref(db, `usernames/${currentUsername.toLowerCase()}`));
                    await set(ref(db, `usernames/${lowerName}`), currentUser.uid);
                    await set(ref(db, `users/${currentUser.uid}/profile/username`), newName);

                    currentUsername = newName; cancelEdit();
                } catch(e) {
                    err.innerText = "Error saving username."; err.style.display = 'block'; cancelEdit();
                }
            }
        }

        function cancelEdit() {
            const input = document.getElementById('username-input');
            const row = document.getElementById('name-row');
            const btn = document.getElementById('edit-name-btn');
            isEditing = false; input.readOnly = true; input.value = currentUsername;
            row.classList.remove('editing'); btn.classList.remove('editing-mode');
            btn.innerHTML = '<i class="fa-solid fa-pen"></i>'; btn.style.pointerEvents = 'auto';
        }

        // --- HISTORY & REVIEWS (MIXED STYLE) ---
        async function fetchHistoryAndReviews() {
            try {
                const [moviesSnap, progressSnap, reviewsSnap] = await Promise.all([
                    get(child(dbRef, `movies`)),
                    get(child(dbRef, `users/${currentUser.uid}/progress`)),
                    get(child(dbRef, `reviews`))
                ]);

                if (moviesSnap.exists()) {
                    const moviesObj = moviesSnap.val();
                    allMoviesData = Object.keys(moviesObj).map(k => ({ id: k, ...moviesObj[k] }));
                }

                // 1. Process History
                if (progressSnap.exists() && allMoviesData.length > 0) {
                    const userProgress = progressSnap.val();
                    let moviesList = [];
                    let seriesGroups = {}; 

                    for(const movieId in userProgress) {
                        const movie = allMoviesData.find(m => m.id === movieId);
                        if(!movie) continue;

                        const prog = userProgress[movieId];

                        if(movie.type === 'series') {
                            for(const epKey in prog) {
                                const epProg = prog[epKey];
                                if(epProg.duration && (epProg.time / epProg.duration) * 100 > 1) {
                                    const p = epKey.split('_'); 
                                    const sIdx = parseInt(p[0].replace('s', ''));
                                    const eIdx = parseInt(p[1].replace('e', ''));
                                    
                                    const epData = movie.seasons && movie.seasons[sIdx] && movie.seasons[sIdx].episodes ? movie.seasons[sIdx].episodes[eIdx] : null;
                                    
                                    if(epData) {
                                        if(!seriesGroups[movieId]) seriesGroups[movieId] = { id: movieId, title: movie.title, episodes: [] };
                                        
                                        // DETAIL HTML WALA DATA BINDING
                                        seriesGroups[movieId].episodes.push({
                                            badge: `S${sIdx + 1} E${eIdx + 1}`,
                                            title: epData.ep_title || `Episode ${eIdx + 1}`,
                                            desc: epData.ep_desc || movie.description || 'No description available.',
                                            thumb: epData.ep_thumb || movie.backdrop || movie.poster, // 16:9 thumbnail
                                            percent: Math.min((epProg.time / epProg.duration) * 100, 100),
                                            last_watched: epProg.last_watched || 0
                                        });
                                    }
                                }
                            }
                        } else {
                            if(prog.duration && (prog.time / prog.duration) * 100 > 1) {
                                moviesList.push({
                                    id: movie.id,
                                    title: movie.title,
                                    desc: movie.description || 'No description available.',
                                    poster: movie.poster, // 2:3 vertical poster
                                    percent: Math.min((prog.time / prog.duration) * 100, 100),
                                    last_watched: prog.last_watched || 0
                                });
                            }
                        }
                    }

                    let historyHtml = '';

                    // SERIES RENDER (DETAIL PAGE HORIZONTAL STYLE)
                    Object.values(seriesGroups).forEach(group => {
                        if(group.episodes.length > 0) {
                            group.episodes.sort((a, b) => b.last_watched - a.last_watched); 
                            historyHtml += `<div class="history-group">
                                <div class="group-header"><i class="fa-solid fa-layer-group"></i> ${group.title}</div>`;
                            
                            group.episodes.forEach(ep => {
                                historyHtml += `
                                <div class="ep-card" onclick="window.location.href='detail.html?id=${group.id}'">
                                    <div class="ep-thumb">
                                        <img src="${ep.thumb}" loading="lazy">
                                        <div class="ep-progress-bg" style="display:block;"><div class="ep-progress-fill" style="width: ${ep.percent}%"></div></div>
                                    </div>
                                    <div class="ep-info">
                                        <span class="ep-num">${ep.badge}</span>
                                        <span class="ep-title">${ep.title}</span>
                                        <p class="ep-desc-text">${ep.desc}</p>
                                    </div>
                                </div>`;
                            });
                            historyHtml += `</div>`;
                        }
                    });

                    // MOVIES RENDER (INDEX PAGE VERTICAL STYLE)
                    if(moviesList.length > 0) {
                        moviesList.sort((a, b) => b.last_watched - a.last_watched);
                        historyHtml += `<div class="history-group">
                            <div class="group-header"><i class="fa-solid fa-clapperboard"></i> Movies</div>`;
                        
                        moviesList.forEach(m => {
                            historyHtml += `
                            <div class="history-card" onclick="window.location.href='detail.html?id=${m.id}'">
                                <div class="history-poster-wrap">
                                    <img src="${m.poster}" class="history-poster" loading="lazy">
                                    <div class="h-progress-bg"><div class="h-progress-fill" style="width: ${m.percent}%"></div></div>
                                </div>
                                <div class="history-info">
                                    <div class="h-title" style="margin-top: 5px;">${m.title}</div>
                                    <div class="h-desc">${m.desc}</div>
                                </div>
                            </div>`;
                        });
                        historyHtml += `</div>`;
                    }

                    if(historyHtml !== '') {
                        document.getElementById('history-sec').style.display = 'block';
                        document.getElementById('history-container').innerHTML = historyHtml;
                    }
                }

                // 2. Process Reviews
                if (reviewsSnap.exists() && allMoviesData.length > 0) {
                    const allReviewsObj = reviewsSnap.val();
                    let myReviews = [];

                    for(const mId in allReviewsObj) {
                        if(allReviewsObj[mId][currentUser.uid]) {
                            const movie = allMoviesData.find(m => m.id === mId);
                            if(movie) {
                                myReviews.push({ 
                                    movieTitle: movie.title, 
                                    data: allReviewsObj[mId][currentUser.uid] 
                                });
                            }
                        }
                    }

                    myReviews.sort((a, b) => b.data.timestamp - a.data.timestamp);

                    if(myReviews.length > 0) {
                        document.getElementById('reviews-sec').style.display = 'block';
                        document.getElementById('reviews-container').innerHTML = myReviews.map(r => {
                            const starsHtml = Array(5).fill(0).map((_,i) => `<i class="fa-solid fa-star" style="color: ${i < r.data.rating ? '#f5c518' : 'rgba(255,255,255,0.1)'}"></i>`).join('');
                            return `
                                <div class="my-review-card">
                                    <div class="rev-movie-title">${r.movieTitle}</div>
                                    <div class="rev-stars">${starsHtml}</div>
                                    <div class="rev-text">"${r.data.text}"</div>
                                </div>
                            `;
                        }).join('');
                    }
                }

            } catch (error) { console.error(error); }
        }

        // --- PLAY-STYLE ANIMATED LOGOUT ---
        window.triggerLogout = function() {
            const wrapper = document.getElementById('logout-wrapper');
            const icon = document.getElementById('logout-icon');
            const text = document.getElementById('logout-text');
            
            wrapper.classList.add('loading');
            icon.className = "fa-solid fa-circle-notch fa-spin";
            text.innerText = "Signing out...";

            setTimeout(() => {
                signOut(auth).then(() => {
                    window.location.replace('login.html');
                }).catch(() => {
                    wrapper.classList.remove('loading');
                    icon.className = "fa-solid fa-power-off";
                    text.innerText = "Logout Account";
                });
            }, 1500); 
        }
    </script>
</body>
</html>
